<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include "_nav.html" %}
  <main class="page">
    <p class="eyebrow">Your profile</p>
    <h1>Keep it personal</h1>
    <p class="lede">Each person gets their own tasks, timer, and encouragement. Profiles stay on this computer.</p>
    {% if error %}
      <p class="form-error">{{ error }}</p>
    {% endif %}

    <form method="post" class="panel">
      <h2>Log in</h2>
      <div class="field">
        <label for="login-name">Name</label>
        <input id="login-name" name="name" class="form-control" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-pin">PIN</label>
        <input id="login-pin" name="pin" type="password" class="form-control" inputmode="numeric" autocomplete="current-password" required>
      </div>
      <button class="submit" type="submit" name="action" value="login">Log in</button>
    </form>

    <form method="post" class="panel">
      <h2>New profile</h2>
      <p class="hint">Use a name your group will recognize, and a PIN of at least 4 characters.</p>
      <div class="field">
        <label for="create-name">Name</label>
        <input id="create-name" name="name" class="form-control" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="create-pin">PIN</label>
        <input id="create-pin" name="pin" type="password" class="form-control" inputmode="numeric" autocomplete="new-password" required>
      </div>
      <button class="submit" type="submit" name="action" value="create">Create profile</button>
    </form>
  </main>
</body>
</html>
