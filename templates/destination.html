<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Action Plan</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      .plan-container {
        max-width: 700px;
        margin: auto;
      }
      .image-placeholder img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container mt-5 mb-5 plan-container">
      <div class="card shadow-sm border-0">
        <div class="card-header text-center bg-primary text-white py-3">
          <!-- Uses the 'title' generated by the LLM -->
          <h3 class="card-title mb-0">{{data['title']}}</h3>
        </div>
        <div class="card-body p-4">
          <div class="image-placeholder text-center mb-4">
            <!-- Displays the generated image -->
            <img src="{{data['image']}}" alt="Motivational Image" class="shadow-sm" />
          </div>
          
          <h5 class="text-muted mb-3 border-bottom pb-2">Your Personalized Plan:</h5>
          
          <!-- Uses the 'advice' generated by the LLM -->
          <p class="card-text" style="font-size: 1.1rem; line-height: 1.6;">
            {{data['advice']}}
          </p>

          <div class="text-center mt-5">
            <a href="/" class="btn btn-outline-primary px-4 py-2">Start a New Task</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
